project_id = "brandwala-wholesale-quasar"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# Match linked hosted project (supabase/.temp/postgres-version → 17.x).
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Quasar local SPA (see web/.env.local.example). Prefer 127.0.0.1 over localhost for cookies.
site_url = "http://127.0.0.1:9000"
additional_redirect_urls = [
  "http://127.0.0.1:9000/**",
  "http://localhost:9000/**",
  "http://127.0.0.1:9000/auth/callback",
  "http://localhost:9000/auth/callback",
]
enable_signup = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
# Local GoTrue callback (add this URI in Google Cloud Console).
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"

[functions.image-proxy]
verify_jwt = false
