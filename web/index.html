<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <link id="dynamic-favicon" rel="icon" type="image/png" href="/brand/favicon-light.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

    <style>
      #app-splash {
        --splash-bg: #fbfaf7;
        --splash-surface: #ffffff;
        --splash-mid: #d1fae5;
        --splash-accent: #0d6b5c;
        --splash-accent-rgb: 13 107 92;
        --splash-ink: #171412;
        --splash-muted: #736a61;
        --splash-glow: rgb(var(--splash-accent-rgb) / 0.35);
        --splash-blob-1: #6ee7b7;
        --splash-blob-3: #a7f3d0;
        --splash-gradient-end: #f0fdf9;
        --splash-accent-dark: #0a5248;
        --splash-icon-tint: #f8fffc;

        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: linear-gradient(
          165deg,
          var(--splash-surface) 0%,
          var(--splash-bg) 55%,
          var(--splash-gradient-end) 100%
        );
        color: var(--splash-ink);
        opacity: 1;
        transition: opacity 0.38s ease;
      }

      #app-splash.app-splash--hide {
        opacity: 0;
        pointer-events: none;
      }

      .app-splash__bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .app-splash__grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgb(23 20 18 / 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgb(23 20 18 / 0.04) 1px, transparent 1px);
        background-size: 52px 52px;
        mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, black 20%, transparent 100%);
      }

      .app-splash__blob {
        position: absolute;
        border-radius: 50%;
      }

      .app-splash__blob--1 {
        width: min(68vw, 560px);
        height: min(68vw, 560px);
        top: -18%;
        left: -12%;
        background: radial-gradient(circle, var(--splash-blob-1) 0%, transparent 68%);
        opacity: 0.45;
      }

      .app-splash__blob--2 {
        width: min(52vw, 420px);
        height: min(52vw, 420px);
        right: -10%;
        bottom: -12%;
        background: radial-gradient(circle, var(--splash-mid) 0%, transparent 70%);
        opacity: 0.85;
      }

      .app-splash__blob--3 {
        width: min(36vw, 280px);
        height: min(36vw, 280px);
        top: 38%;
        left: 58%;
        background: radial-gradient(circle, var(--splash-blob-3) 0%, transparent 70%);
        opacity: 0.55;
      }

      .app-splash__ghost {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -52%);
        font-family:
          'Plus Jakarta Sans',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        font-size: clamp(5.5rem, 18vw, 13rem);
        font-weight: 900;
        line-height: 0.85;
        letter-spacing: -0.06em;
        white-space: nowrap;
        color: transparent;
        -webkit-text-stroke: 1px rgb(var(--splash-accent-rgb) / 0.07);
        background: linear-gradient(
          160deg,
          rgb(var(--splash-accent-rgb) / 0.04) 0%,
          rgb(var(--splash-accent-rgb) / 0.08) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        user-select: none;
        pointer-events: none;
      }

      .app-splash__content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.35rem;
        padding: 2rem;
        animation: app-splash-rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .app-splash__logo {
        width: min(300px, 78vw);
        height: auto;
        display: block;
      }

      .app-splash__tenant {
        margin: 0;
        font-family:
          'Plus Jakarta Sans',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--splash-muted);
      }

      .app-splash__tenant[hidden] {
        display: none;
      }

      .app-splash__loader {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        margin-top: 0.35rem;
      }

      .app-splash__dot {
        width: 0.42rem;
        height: 0.42rem;
        border-radius: 50%;
        background: var(--splash-accent);
        box-shadow: 0 0 10px var(--splash-glow);
      }

      @keyframes app-splash-rise {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="app-splash__bg" aria-hidden="true">
        <div class="app-splash__blob app-splash__blob--1"></div>
        <div class="app-splash__blob app-splash__blob--2"></div>
        <div class="app-splash__blob app-splash__blob--3"></div>
        <div class="app-splash__grid"></div>
        <div class="app-splash__ghost" id="app-splash-ghost">Operations</div>
      </div>

      <div class="app-splash__content">
        <img
          id="app-splash-logo"
          class="app-splash__logo"
          src="/brand/logo-light.png"
          alt="TradeFlow BD — Enterprise resource planning, B2B commerce"
          decoding="async"
        />
        <p class="app-splash__tenant" id="app-splash-tenant" hidden></p>

        <div class="app-splash__loader" aria-hidden="true">
          <span class="app-splash__dot"></span>
          <span class="app-splash__dot"></span>
          <span class="app-splash__dot"></span>
        </div>
      </div>
    </div>
    <script>
      (function initAppSplashTheme() {
        var AUTH_KEY = 'brandwala.auth.access.v4';
        var WORKSPACE_KEY = 'brandwala.tenant.workspace.v1';

        var SCOPE_THEMES = {
          platform: {
            accent: '#ef4444',
            accentRgb: '239 68 68',
            mid: '#fee2e2',
            blob1: '#fca5a5',
            blob3: '#fecaca',
            gradientEnd: '#fff5f5',
            accentDark: '#b91c1c',
            iconTint: '#fffafa',
            ghost: 'Platform',
            tagline: 'Govern the platform',
          },
          app: {
            accent: '#10b981',
            accentRgb: '16 185 129',
            mid: '#d1fae5',
            blob1: '#6ee7b7',
            blob3: '#a7f3d0',
            gradientEnd: '#f0fdf9',
            accentDark: '#047857',
            iconTint: '#f8fffc',
            ghost: 'Operations',
            tagline: 'Run your business',
          },
          shop: {
            accent: '#3b82f6',
            accentRgb: '59 130 246',
            mid: '#dbeafe',
            blob1: '#93c5fd',
            blob3: '#bfdbfe',
            gradientEnd: '#eff6ff',
            accentDark: '#1d4ed8',
            iconTint: '#f8fbff',
            ghost: 'Store',
            tagline: 'Your wholesale store',
          },
          investor: {
            accent: '#0f766e',
            accentRgb: '15 118 110',
            mid: '#ccfbf1',
            blob1: '#5eead4',
            blob3: '#99f6e4',
            gradientEnd: '#f0fdfa',
            accentDark: '#0f5f59',
            iconTint: '#f7fffe',
            ghost: 'Investor',
            tagline: 'Your portfolio',
          },
          default: {
            accent: '#0d6b5c',
            accentRgb: '13 107 92',
            mid: '#d1fae5',
            blob1: '#6ee7b7',
            blob3: '#a7f3d0',
            gradientEnd: '#f0fdf9',
            accentDark: '#0a5248',
            iconTint: '#f8fffc',
            ghost: 'Operations',
            tagline: 'Run your business',
          },
        };

        function readJson(key) {
          try {
            var raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : null;
          } catch (error) {
            return null;
          }
        }

        function detectScopeFromPath(path) {
          if (/^\/platform(\/|$)/.test(path)) return 'platform';
          if (/\/investor(\/|$)/.test(path)) return 'investor';
          if (/\/(shop)(\/|$)/.test(path)) return 'shop';
          if (/\/(app)(\/|$)/.test(path)) return 'app';
          return null;
        }

        function resolveScope(path, auth) {
          return detectScopeFromPath(path) || (auth && auth.scope) || 'default';
        }

        function findTenantBySlug(tenants, slug) {
          if (!slug || !Array.isArray(tenants)) return null;
          for (var i = 0; i < tenants.length; i++) {
            if (tenants[i] && tenants[i].slug === slug) return tenants[i];
          }
          return null;
        }

        function findTenantById(tenants, id) {
          if (id == null || !Array.isArray(tenants)) return null;
          for (var i = 0; i < tenants.length; i++) {
            if (tenants[i] && tenants[i].id === id) return tenants[i];
          }
          return null;
        }

        function resolveTenantName(scope, auth, workspace, path) {
          var tenants = workspace && workspace.availableAdminTenants;
          var slugMatch = path.match(/^\/([^/]+)\/(app|shop|investor)/);
          var urlSlug = slugMatch ? slugMatch[1] : null;

          if (urlSlug) {
            var slugTenant = findTenantBySlug(tenants, urlSlug);
            if (slugTenant && slugTenant.name) return slugTenant.name;

            if (auth && auth.tenant && auth.tenant.slug === urlSlug && auth.tenant.name) {
              return auth.tenant.name;
            }

            // Fallback for slugs: replace hyphens with spaces and title case
            return urlSlug.split('-').map(function(word) {
              return word ? word.charAt(0).toUpperCase() + word.slice(1) : '';
            }).join(' ');
          }

          if (scope === 'app' && workspace && workspace.selectedTenantId != null) {
            var selected = findTenantById(tenants, workspace.selectedTenantId);
            if (selected && selected.name) return selected.name;
          }

          if (auth && auth.tenant && auth.tenant.name) return auth.tenant.name;

          return null;
        }

        function isDarkAppearance() {
          try {
            var localDark = localStorage.getItem('brandwala.appearance.darkMode');
            if (localDark === 'true') return true;
            if (localDark === 'false') return false;
          } catch (error) {
            // ignore
          }
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        var BRAND_LOGO_LIGHT_SRC = '/brand/logo-light.png';
        var BRAND_LOGO_DARK_SRC = '/brand/logo-dark.png';
        var BRAND_FAVICON_LIGHT_SRC = '/brand/favicon-light.png';
        var BRAND_FAVICON_DARK_SRC = '/brand/favicon-dark.png';

        var splashDark = isDarkAppearance();
        var BRAND_LOGO_SRC = splashDark ? BRAND_LOGO_DARK_SRC : BRAND_LOGO_LIGHT_SRC;
        var BRAND_FAVICON_SRC = splashDark ? BRAND_FAVICON_DARK_SRC : BRAND_FAVICON_LIGHT_SRC;

        var splash = document.getElementById('app-splash');
        if (!splash) return;

        var path = window.location.pathname || '/';
        if (window.location.hash && window.location.hash.indexOf('#/') === 0) {
          path = window.location.hash.substring(1); // Converts "#/my-shop/shop" into "/my-shop/shop"
        }

        var auth = readJson(AUTH_KEY);
        var workspace = readJson(WORKSPACE_KEY);
        var scope = resolveScope(path, auth);
        var theme = SCOPE_THEMES[scope] || SCOPE_THEMES.default;
        var tenantName = resolveTenantName(scope, auth, workspace, path);

        splash.dataset.scope = scope;
        if (splashDark) {
          splash.style.setProperty('--splash-bg', '#171412');
          splash.style.setProperty('--splash-surface', '#1f1c19');
          splash.style.setProperty('--splash-ink', '#f5f2ec');
          splash.style.setProperty('--splash-muted', '#a89f94');
        }
        splash.style.setProperty('--splash-accent', theme.accent);
        splash.style.setProperty('--splash-accent-rgb', theme.accentRgb);
        splash.style.setProperty('--splash-mid', theme.mid);
        splash.style.setProperty('--splash-blob-1', theme.blob1);
        splash.style.setProperty('--splash-blob-3', theme.blob3);
        splash.style.setProperty('--splash-gradient-end', theme.gradientEnd);
        splash.style.setProperty('--splash-accent-dark', theme.accentDark);
        splash.style.setProperty('--splash-icon-tint', theme.iconTint);
        splash.style.setProperty('--splash-glow', 'rgb(' + theme.accentRgb + ' / 0.35)');

        var ghost = document.getElementById('app-splash-ghost');
        if (ghost) ghost.textContent = theme.ghost;

        var tenantLine = document.getElementById('app-splash-tenant');
        if (tenantLine) {
          if (tenantName && tenantName !== 'TradeFlowBD' && tenantName !== 'TradeFlow BD') {
            tenantLine.textContent = tenantName;
            tenantLine.hidden = false;
          } else {
            tenantLine.textContent = '';
            tenantLine.hidden = true;
          }
        }

        var logo = document.getElementById('app-splash-logo');
        if (logo) logo.src = BRAND_LOGO_SRC;

        var favicon = document.getElementById('dynamic-favicon');
        if (favicon) {
          favicon.type = 'image/png';
          favicon.href = BRAND_FAVICON_SRC;
        }

        if (splashDark) {
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', '#171412');
        }

        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (!metaTheme) {
          metaTheme = document.createElement('meta');
          metaTheme.name = 'theme-color';
          document.head.appendChild(metaTheme);
        }
        metaTheme.content = theme.accent;
      })();
    </script>
    <!-- quasar:entry-point -->
  </body>
</html>
