<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <link id="dynamic-favicon" rel="icon" type="image/png" href="/brand/favicon-light.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      #app-splash {
        --splash-bg: #f4f6f8;
        --splash-surface: #ffffff;
        --splash-accent: #0d6b5c;
        --splash-accent-rgb: 13 107 92;
        --splash-ink: #0f172a;
        --splash-muted: #64748b;
        --splash-glow: rgb(var(--splash-accent-rgb) / 0.14);
        --splash-gradient-end: #eef2f6;
        --splash-accent-soft: rgb(var(--splash-accent-rgb) / 0.1);

        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: linear-gradient(
          180deg,
          var(--splash-surface) 0%,
          var(--splash-bg) 42%,
          var(--splash-gradient-end) 100%
        );
        color: var(--splash-ink);
        opacity: 1;
        transition: opacity 0.32s ease;
      }

      #app-splash.app-splash--hide {
        opacity: 0;
        pointer-events: none;
      }

      .app-splash__backdrop {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .app-splash__glow {
        position: absolute;
        width: min(72vw, 520px);
        height: min(72vw, 520px);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -54%);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          var(--splash-glow) 0%,
          transparent 68%
        );
        opacity: 0.9;
      }

      .app-splash__content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.85rem;
        width: min(100%, 360px);
        padding: 1.75rem 1.5rem 1.5rem;
        animation: app-splash-rise 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .app-splash__logo {
        width: auto;
        height: clamp(44px, 10vw, 58px);
        max-width: min(168px, 40vw);
        object-fit: contain;
        display: block;
        margin-top: 0.15rem;
      }

      .app-splash__tenant {
        margin: 0;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--splash-ink);
        text-align: center;
        line-height: 1.35;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .app-splash__tenant[hidden] {
        display: none;
      }

      .app-splash__tagline {
        margin: -0.15rem 0 0;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--splash-muted);
        text-align: center;
        line-height: 1.4;
      }

      .app-splash__loader {
        display: flex;
        align-items: center;
        gap: 0.38rem;
        margin-top: 0.55rem;
      }

      .app-splash__dot {
        width: 0.34rem;
        height: 0.34rem;
        border-radius: 50%;
        background: var(--splash-accent);
        opacity: 0.35;
        animation: app-splash-dot 1.1s ease-in-out infinite;
      }

      .app-splash__dot:nth-child(2) {
        animation-delay: 0.15s;
      }

      .app-splash__dot:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes app-splash-rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes app-splash-dot {
        0%,
        80%,
        100% {
          opacity: 0.28;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-splash__content,
        .app-splash__dot {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="app-splash__backdrop" aria-hidden="true">
        <div class="app-splash__glow"></div>
      </div>

      <div class="app-splash__content">
        <img
          id="app-splash-logo"
          class="app-splash__logo"
          src="/brand/logo-light.png"
          alt="TradeFlow BD"
          decoding="async"
        />
        <p class="app-splash__tenant" id="app-splash-tenant" hidden></p>
        <p class="app-splash__tagline" id="app-splash-tagline">Run your business</p>

        <div class="app-splash__loader" aria-hidden="true">
          <span class="app-splash__dot"></span>
          <span class="app-splash__dot"></span>
          <span class="app-splash__dot"></span>
        </div>
      </div>
    </div>
    <script>
      (function initAppSplashTheme() {
        var AUTH_KEY = 'brandwala.auth.access.v4';
        var WORKSPACE_KEY = 'brandwala.tenant.workspace.v1';

        var SCOPE_THEMES = {
          platform: {
            accent: '#464b71',
            accentRgb: '70 75 113',
            mid: '#e8ebf0',
            blob1: '#7cd5c7',
            blob3: '#b8c4d8',
            gradientEnd: '#f2f2ed',
            accentDark: '#118ab2',
            iconTint: '#f8f9fc',
            ghost: 'Platform',
            tagline: 'Govern the platform',
          },
          app: {
            accent: '#488b8f',
            accentRgb: '72 139 143',
            mid: '#d9ebe7',
            blob1: '#5ea3a3',
            blob3: '#add2c9',
            gradientEnd: '#faf9f9',
            accentDark: '#488b8f',
            iconTint: '#f8fcfb',
            ghost: 'Operations',
            tagline: 'Run your business',
          },
          shop: {
            accent: '#3368a0',
            accentRgb: '51 104 160',
            mid: '#dce8ef',
            blob1: '#66a3bf',
            blob3: '#c8dfdb',
            gradientEnd: '#f2efe7',
            accentDark: '#3368a0',
            iconTint: '#f8fbff',
            ghost: 'Store',
            tagline: 'Your wholesale store',
          },
          investor: {
            accent: '#413333',
            accentRgb: '65 51 51',
            mid: '#efe6dc',
            blob1: '#f2765e',
            blob3: '#f5ebdd',
            gradientEnd: '#f5ebdd',
            accentDark: '#413333',
            iconTint: '#fffaf8',
            ghost: 'Investor',
            tagline: 'Your portfolio',
          },
          default: {
            accent: '#488b8f',
            accentRgb: '72 139 143',
            mid: '#d9ebe7',
            blob1: '#5ea3a3',
            blob3: '#add2c9',
            gradientEnd: '#faf9f9',
            accentDark: '#488b8f',
            iconTint: '#f8fcfb',
            ghost: 'Operations',
            tagline: 'Run your business',
          },
        };

        function readJson(key) {
          try {
            var raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : null;
          } catch (error) {
            return null;
          }
        }

        function detectScopeFromPath(path) {
          if (/^\/platform(\/|$)/.test(path)) return 'platform';
          if (/\/investor(\/|$)/.test(path)) return 'investor';
          if (/\/(shop)(\/|$)/.test(path)) return 'shop';
          if (/\/(app)(\/|$)/.test(path)) return 'app';
          return null;
        }

        function resolveScope(path, auth) {
          return detectScopeFromPath(path) || (auth && auth.scope) || 'default';
        }

        function findTenantBySlug(tenants, slug) {
          if (!slug || !Array.isArray(tenants)) return null;
          for (var i = 0; i < tenants.length; i++) {
            if (tenants[i] && tenants[i].slug === slug) return tenants[i];
          }
          return null;
        }

        function findTenantById(tenants, id) {
          if (id == null || !Array.isArray(tenants)) return null;
          for (var i = 0; i < tenants.length; i++) {
            if (tenants[i] && tenants[i].id === id) return tenants[i];
          }
          return null;
        }

        function resolveTenantName(scope, auth, workspace, path) {
          var tenants = workspace && workspace.availableAdminTenants;
          var slugMatch = path.match(/^\/([^/]+)\/(app|shop|investor)/);
          var urlSlug = slugMatch ? slugMatch[1] : null;

          if (urlSlug) {
            var slugTenant = findTenantBySlug(tenants, urlSlug);
            if (slugTenant && slugTenant.name) return slugTenant.name;

            if (auth && auth.tenant && auth.tenant.slug === urlSlug && auth.tenant.name) {
              return auth.tenant.name;
            }

            // Fallback for slugs: replace hyphens with spaces and title case
            return urlSlug.split('-').map(function(word) {
              return word ? word.charAt(0).toUpperCase() + word.slice(1) : '';
            }).join(' ');
          }

          if (scope === 'app' && workspace && workspace.selectedTenantId != null) {
            var selected = findTenantById(tenants, workspace.selectedTenantId);
            if (selected && selected.name) return selected.name;
          }

          if (auth && auth.tenant && auth.tenant.name) return auth.tenant.name;

          return null;
        }

        function isDarkAppearance() {
          try {
            var localDark = localStorage.getItem('brandwala.appearance.darkMode');
            if (localDark === 'true') return true;
            if (localDark === 'false') return false;
          } catch (error) {
            // ignore
          }
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        var BRAND_LOGO_LIGHT_SRC = '/brand/logo-light.png';
        var BRAND_LOGO_DARK_SRC = '/brand/logo-dark.png';
        var BRAND_FAVICON_LIGHT_SRC = '/brand/favicon-light.png';
        var BRAND_FAVICON_DARK_SRC = '/brand/favicon-dark.png';

        var splashDark = isDarkAppearance();
        var BRAND_LOGO_SRC = splashDark ? BRAND_LOGO_DARK_SRC : BRAND_LOGO_LIGHT_SRC;
        var BRAND_FAVICON_SRC = splashDark ? BRAND_FAVICON_DARK_SRC : BRAND_FAVICON_LIGHT_SRC;

        var splash = document.getElementById('app-splash');
        if (!splash) return;

        var path = window.location.pathname || '/';
        if (window.location.hash && window.location.hash.indexOf('#/') === 0) {
          path = window.location.hash.substring(1); // Converts "#/my-shop/shop" into "/my-shop/shop"
        }

        var auth = readJson(AUTH_KEY);
        var workspace = readJson(WORKSPACE_KEY);
        var scope = resolveScope(path, auth);
        var theme = SCOPE_THEMES[scope] || SCOPE_THEMES.default;
        var tenantName = resolveTenantName(scope, auth, workspace, path);

        var DARK_LOADER_ACCENTS = {
          platform: '#118ab2',
          app: '#5ea3a3',
          shop: '#66a3bf',
          investor: '#f2765e',
          default: '#5ea3a3',
        };

        splash.dataset.scope = scope;
        if (splashDark) {
          splash.style.setProperty('--splash-bg', '#09090b');
          splash.style.setProperty('--splash-surface', '#18181b');
          splash.style.setProperty('--splash-gradient-end', '#09090b');
          splash.style.setProperty('--splash-ink', '#f4f4f5');
          splash.style.setProperty('--splash-muted', '#a1a1aa');
          splash.style.setProperty('--splash-glow', 'rgb(' + theme.accentRgb + ' / 0.1)');
          splash.style.setProperty(
            '--splash-accent',
            DARK_LOADER_ACCENTS[scope] || DARK_LOADER_ACCENTS.default,
          );
        } else {
          splash.style.setProperty('--splash-glow', 'rgb(' + theme.accentRgb + ' / 0.14)');
          splash.style.setProperty('--splash-gradient-end', theme.gradientEnd);
          splash.style.setProperty('--splash-accent', theme.accent);
        }
        splash.style.setProperty('--splash-accent-rgb', theme.accentRgb);

        var tagline = document.getElementById('app-splash-tagline');
        if (tagline) tagline.textContent = theme.tagline;

        var tenantLine = document.getElementById('app-splash-tenant');
        if (tenantLine) {
          if (tenantName && tenantName !== 'TradeFlowBD' && tenantName !== 'TradeFlow BD') {
            tenantLine.textContent = tenantName;
            tenantLine.hidden = false;
          } else {
            tenantLine.textContent = '';
            tenantLine.hidden = true;
          }
        }

        var logo = document.getElementById('app-splash-logo');
        if (logo) logo.src = BRAND_LOGO_SRC;

        function applyScopedFavicon(accent) {
          var favicon = document.getElementById('dynamic-favicon');
          if (!favicon) return;

          favicon.type = 'image/png';
          var mark = new Image();
          mark.onload = function () {
            var canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            var ctx = canvas.getContext('2d');
            if (!ctx) {
              favicon.href = BRAND_FAVICON_SRC;
              return;
            }
            ctx.drawImage(mark, 0, 0, 64, 64);
            ctx.globalCompositeOperation = 'source-in';
            ctx.fillStyle = accent;
            ctx.fillRect(0, 0, 64, 64);
            favicon.href = canvas.toDataURL('image/png');
          };
          mark.onerror = function () {
            favicon.href = BRAND_FAVICON_SRC;
          };
          mark.src = '/brand/logo-mark-light.png';
        }

        var splashAccent = splashDark
          ? DARK_LOADER_ACCENTS[scope] || DARK_LOADER_ACCENTS.default
          : theme.accent;
        applyScopedFavicon(splashAccent);

        if (splashDark) {
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', '#09090b');
        }

        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (!metaTheme) {
          metaTheme = document.createElement('meta');
          metaTheme.name = 'theme-color';
          document.head.appendChild(metaTheme);
        }
        metaTheme.content = splashDark ? '#09090b' : '#f4f6f8';
      })();
    </script>
    <!-- quasar:entry-point -->
  </body>
</html>
